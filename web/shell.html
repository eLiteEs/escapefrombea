<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Escape From Marisa 3: Escape From Bea</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #0c0c12;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      height: 100%;
    }
    #canvas-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    canvas.emscripten {
      display: block;
      outline: none;
      max-width: 100%;
      max-height: 100%;
      border: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #0c0c12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { color: #d22d3c; margin: 0 0 20px; font-size: 2em; letter-spacing: 2px; }
    #loading .bar {
      width: 320px; height: 8px;
      background: #1a1a22;
      border-radius: 4px;
      overflow: hidden;
    }
    #loading .bar-fill {
      height: 100%; width: 0%;
      background: #46dc82;
      transition: width 0.2s;
    }
    #loading .status {
      margin-top: 12px; font-size: 0.85em; color: #888;
    }
    #hint {
      position: fixed;
      bottom: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85em;
      color: #ccc;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="loading">
    <h1>ESCAPE FROM BEA</h1>
    <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    <div class="status" id="status">Cargando...</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>
  <div id="hint">Pulsa para activar sonido y empezar</div>

  <script>
        var Module = {
      canvas: (function() {
        var c = document.getElementById('canvas');
        c.addEventListener('webglcontextlost', function(e) {
          alert('Se perdio el contexto WebGL. Recarga la pagina.');
          e.preventDefault();
        }, false);
        return c;
      })(),
      setStatus: function(text) {
        document.getElementById('status').textContent = text || 'Cargando...';
      },
      onRuntimeInitialized: function() {
        document.getElementById('loading').classList.add('hidden');
      },
      onAbort: function(what) {
        alert('Error: ' + what);
      },
      print: function(t) { console.log(t); },
      printErr: function(t) { console.error(t); },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        var pct = left === 0 ? 100 : (this.totalDependencies - left) / this.totalDependencies * 100;
        document.getElementById('bar-fill').style.width = pct + '%';
      }
    };
	document.getElementById('canvas').addEventListener('click', function() {
      document.getElementById('hint').classList.add('hidden');
    }, { once: true });
  </script>

  {{{ SCRIPT }}}
</body>
</html>
